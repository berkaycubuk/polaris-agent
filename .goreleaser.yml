version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: polaris
    main: ./cmd/polaris
    binary: polaris
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

  - id: polaris-server
    main: ./cmd/server
    binary: polaris-server
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    goos:
      - linux
    goarch:
      - amd64
      - arm64

archives:
  - name_template: >-
      polaris_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - README.md
      - LICENSE

dockers:
  - ids:
      - polaris-server
    dockerfile: Dockerfile.goreleaser
    build_flag_templates:
      - --label=org.opencontainers.image.title={{.ProjectName}}
      - --label=org.opencontainers.image.version={{.Version}}
      - --label=org.opencontainers.image.revision={{.Commit}}
      - --label=org.opencontainers.image.source={{.GitURL}}
    image_templates:
      - "ghcr.io/berkaycubuk/polaris-agent:{{.Version}}"
      - "ghcr.io/berkaycubuk/polaris-agent:latest"

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - Merge pull request
      - Merge branch

release:
  github:
    owner: berkaycubuk
    name: polaris-agent
  draft: false
  prerelease: auto
